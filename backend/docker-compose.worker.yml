services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - examai-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: .
    restart: unless-stopped
    command: celery -A app.worker.celery_app:celery_app worker --loglevel=info
    env_file:
      - path: ../.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  beat:
    build: .
    restart: unless-stopped
    command: celery -A app.worker.celery_app:celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file:
      - path: ../.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  examai-redis:
